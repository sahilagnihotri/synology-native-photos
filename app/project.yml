name: SynologyPhotos
options:
  bundleIdPrefix: se.agnihotri
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_LDFLAGS: ["-lc++"]
    # Project-wide signing so the app AND the test bundles share one team.
    # If only the app target carries DEVELOPMENT_TEAM, the test bundle is
    # signed with a different (ad-hoc) identity and the runner refuses to
    # load it: "mapping process and mapped file have different Team IDs".
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "5W67TF3579"
targets:
  PhotosCore:
    type: framework
    platform: macOS
    sources:
      - path: ../bindings/PhotosCore.swift
        group: Generated
      - path: ../bindings/models.swift
        group: Generated
    preBuildScripts:
      - name: "Ensure PhotosCore.xcframework"
        script: |
          "${SRCROOT}/../scripts/xcodegen/ensure-xcframework.sh"
        shell: /bin/bash
        outputFiles:
          - "$(SRCROOT)/../PhotosCore.xcframework/macos-arm64/libphotoscore.a"
    settings:
      base:
        PRODUCT_NAME: PhotosCore
        PRODUCT_MODULE_NAME: PhotosCore
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../PhotosCore.xcframework/macos-arm64/Headers"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../PhotosCore.xcframework/macos-arm64"
        OTHER_LDFLAGS: ["-lphotoscore", "-lc++"]
  SynologyPhotos:
    type: application
    platform: macOS
    sources:
      - path: SynologyPhotos
      # Generated at build time by the preBuildScript below. Referenced by
      # an explicit path (not a directory glob) and marked optional so
      # `xcodegen generate` still succeeds on a clean checkout where this
      # gitignored file is absent. It lives in app/Generated (outside the
      # globbed SynologyPhotos dir) so it is never a duplicate file ref.
      - path: Generated/GitVersion.swift
        optional: true
    preBuildScripts:
      - name: "Generate GitVersion.swift"
        script: |
          "${SRCROOT}/../scripts/xcodegen/generate-git-version.sh" "${SRCROOT}/Generated/GitVersion.swift"
        shell: /bin/bash
        # outputFiles makes the new build system treat the compile of
        # GitVersion.swift as depending on this phase, so the phase runs
        # before Compile Sources and the build does not pre-fail when the
        # generated file is missing on a fresh checkout.
        outputFiles:
          - "$(SRCROOT)/Generated/GitVersion.swift"
        # Always run so the SHA stays fresh across commits; the script itself
        # only rewrites the file (and thus triggers a recompile) when the SHA
        # actually changed.
        basedOnDependencyAnalysis: false
    dependencies:
      - target: PhotosCore
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.agnihotri.synologyphotos
        # Explicit so the About window shows deterministic values instead of
        # relying on GENERATE_INFOPLIST_FILE defaults.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        # Stable local dev signing. Plain ad-hoc signing (the Xcode default
        # with no team selected, CODE_SIGN_IDENTITY "-") re-derives the code
        # signature on every build with no team backing it, so macOS treats
        # a rebuild as a different app and any "Always Allow" Keychain
        # grant on the remaining secret items (SID/session, device token)
        # does not reliably persist across rebuilds.
        #
        # CODE_SIGN_IDENTITY "Apple Development" signs with whichever
        # personal/team development identity Xcode already has (Xcode ->
        # Settings -> Accounts), which is what actually keeps the signature
        # stable and team-backed across rebuilds. DEVELOPMENT_TEAM is left
        # unset here on purpose: this machine has more than one Apple
        # Development identity installed, and no team id can be verified as
        # "the" one to hardcode. Automatic signing resolves it, but if more
        # than one team is available Xcode may ask you to pick once in the
        # Signing & Capabilities tab for the SynologyPhotos target after
        # opening the generated project; after that one choice, rebuilds
        # keep reusing it. To pin a specific team non-interactively instead,
        # pass DEVELOPMENT_TEAM=<your team id> as an env var to `xcodegen
        # generate` and to `xcodebuild`.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "5W67TF3579"
        # PhotosCoreFFI/modelsFFI are the raw UniFFI C scaffolding that
        # bindings/PhotosCore.swift and bindings/models.swift guard behind
        # `#if canImport(...)`. No public symbol of the PhotosCore Swift
        # module ever names these C types (verified: the only C-level type
        # crossing into public API is the opaque UnsafeMutableRawPointer),
        # so app/test code never imports them and never sees their symbols.
        # Swift's explicit-module dependency scanner still needs the two
        # C modules to *resolve* wherever PhotosCore is imported, so this
        # search path is required at the Clang-module level even though
        # nothing here uses it directly.
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../PhotosCore.xcframework/macos-arm64/Headers"
  SynologyPhotosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SynologyPhotosTests
    dependencies:
      - target: SynologyPhotos
      - target: PhotosCore
        embed: false
        link: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../PhotosCore.xcframework/macos-arm64/Headers"
  SynologyPhotosUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SynologyPhotosUITests
    dependencies:
      - target: SynologyPhotos
      - target: PhotosCore
        embed: false
        link: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../PhotosCore.xcframework/macos-arm64/Headers"
aggregateTargets:
  # A no-product target that packages the app into a .dmg installer. It depends
  # on the app target, so building the "Installer" scheme first builds
  # SynologyPhotos with Xcode's own build (NOT a nested xcodebuild), then this
  # phase runs dmg-from-app.sh on the app Xcode just produced. That script is
  # the single source of truth for packaging, also used by the CLI `make dmg`,
  # so both paths create identical installers. Build it in Release (the scheme
  # below defaults to it) to ship a real installer.
  Installer:
    targets:
      - SynologyPhotos
    buildScripts:
      - name: "Package DMG"
        script: |
          "${SRCROOT}/../scripts/package/dmg-from-app.sh" "${BUILT_PRODUCTS_DIR}/SynologyPhotos.app"
        shell: /bin/bash
        # Always repackage: the dmg should reflect whatever was just built, and
        # declaring no outputs would otherwise make Xcode warn on every build.
        basedOnDependencyAnalysis: false
schemes:
  SynologyPhotos:
    build:
      targets:
        SynologyPhotos: all
        SynologyPhotosTests: [test]
        SynologyPhotosUITests: [test]
    test:
      targets:
        - SynologyPhotosTests
  # Select this scheme in Xcode and Build (Cmd-B) to produce the dmg in dist/.
  # Defaults to Release so the packaged app is a release build.
  Installer:
    build:
      targets:
        Installer: all
    run:
      config: Release
