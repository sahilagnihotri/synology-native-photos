[workspace]
resolver = "2"
members = [
    "core/models",
    "core/synology-api",
    "core/persistence",
    "core/sync-engine",
    "core/photoscore",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
sha2 = "0.10"
x509-parser = "0.18"
